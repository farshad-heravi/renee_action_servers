capture_rgbd_action_server:
  ros__parameters:
    capture_mode: real
    default_frame_count: 30
    session_dir: /tmp/renee_scan_session
    sync_tolerance_ms: 5.0
    capture_timeout_sec: 20.0
    tf_timeout_sec: 0.5
    max_linear_speed: 0.01
    max_angular_speed: 0.0175
    map_frame: robot_map
    odom_frame: robot_odom
    base_frame: robot_base_link
    camera_frame: robot_arm_rgbd_camera_color_optical_frame
    camera_node: /robot/arm_rgbd_camera
    manage_camera_controls: true
    camera_warmup_sec: 2.0
    rgb_topic: /robot/arm_rgbd_camera/color/image_raw
    depth_topic: /robot/arm_rgbd_camera/depth/image_rect_raw
    aligned_depth_topic: /robot/arm_rgbd_camera/aligned_depth_to_color/image_raw
    infrared_left_topic: /robot/arm_rgbd_camera/infra1/image_rect_raw
    infrared_right_topic: /robot/arm_rgbd_camera/infra2/image_rect_raw
    color_info_topic: /robot/arm_rgbd_camera/color/camera_info
    depth_info_topic: /robot/arm_rgbd_camera/depth/camera_info
    infrared_left_info_topic: /robot/arm_rgbd_camera/infra1/camera_info
    infrared_right_info_topic: /robot/arm_rgbd_camera/infra2/camera_info
    color_metadata_topic: /robot/arm_rgbd_camera/color/metadata
    depth_metadata_topic: /robot/arm_rgbd_camera/depth/metadata
    infrared_left_metadata_topic: /robot/arm_rgbd_camera/infra1/metadata
    infrared_right_metadata_topic: /robot/arm_rgbd_camera/infra2/metadata
    depth_to_color_extrinsics_topic: /robot/arm_rgbd_camera/extrinsics/depth_to_color
    camera_accel_topic: /robot/arm_rgbd_camera/accel/sample
    camera_gyro_topic: /robot/arm_rgbd_camera/gyro/sample
    wheel_odom_topic: /robot/robotnik_base_control/odom
    amcl_topic: /robot/amcl_pose
    rover_imu_topic: /robot/imu/data
